[project]
name = "goal-workflow-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["filelock==3.19.1", "psutil==7.1.0", "jsonschema==4.26.0", "Markdown==3.9"]
[project.scripts]
goal-harness = "harness.cli:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "harness/schemas"
