name: Goal harness platform smoke
on:
  pull_request:
    branches: ['goal-harness/smoke-base-20261001']
permissions:
  contents: read
jobs:
  smoke:
    name: goal-harness-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record candidate identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'source=%s\ntarget=%s\ncandidate=%s\n' "$SOURCE_SHA" "$TARGET_SHA" "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Boundary tests
        run: python3 .goal-harness-smoke/test_boundary.py
